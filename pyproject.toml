[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hackerbox"
version = "1.0.0"
authors = [
  { name="Sami", email="samifurqanakram@gmail.com" },
]
description = "A powerful, multi-functional cybersecurity toolkit for security professionals and enthusiasts."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GNU Affero General Public License v3.0"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "python-dotenv>=0.19.0",
    "colorama>=0.4.4",
    "requests>=2.28.1",
    "beautifulsoup4>=4.11.1",
    "lxml>=4.9.1",
    "plumbum>=1.8.0",
    "prompt_toolkit>=3.0.36",
    "click>=8.1.3",
    "rich>=12.5.1",
    "psutil>=5.9.0",
    "netifaces>=0.11.0",
    "scapy>=2.5.0",
    "python-nmap>=0.7.1",
    "cryptography>=38.0.1",
    "pyOpenSSL>=22.1.0",
    "paramiko>=2.11.0",
    "urllib3>=1.26.12",
    "python-dateutil>=2.8.2",
    "tqdm>=4.64.1",
    "pytz>=2022.2.1",
    "Pillow>=9.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.19.0",
    "bandit>=1.7.0",
    "safety>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/mynameissami/HackerBox"
Documentation = "https://github.com/mynameissami/HackerBox#readme"
Bug Tracker = "https://github.com/mynameissami/HackerBox/issues"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[flake8]
max-line-length = 88
extend-ignore = "E203, W503"
max-complexity = 18
select = "B,C,E,F,W,T4,B9"

[isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
